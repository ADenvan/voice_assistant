[project]
name = "voice_assistant" # имя проекта_assistant.main:main" 
version = "0.1.0"
description = "Educational Russian voice AI assistant"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src"] # без tests

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]